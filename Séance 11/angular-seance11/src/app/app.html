  <app-navbar></app-navbar>

  <div class="workspace-body">
    <app-sidebar></app-sidebar>

    <main class="content-viewport">
      @switch (nav.activeTab()) {
        @case ('crise-maintenance') {
          <app-crise-maintenance></app-crise-maintenance>
        }
        @case ('srp-single-responsibility') {
          <app-srp-single-responsibility></app-srp-single-responsibility>
        }
        @case ('ocp-open-closed') {
          <app-ocp-open-closed></app-ocp-open-closed>
        }
        @case ('dip-dependency-inversion') {
          <app-dip-dependency-inversion></app-dip-dependency-inversion>
        }
        @case ('dip-angular-testing') {
          <app-dip-angular-testing></app-dip-angular-testing>
        }
        @case ('synergie-sod-arbitrage') {
          <app-synergie-sod-arbitrage></app-synergie-sod-arbitrage>
        }

          <app-workshops-lab></app-workshops-lab>
        }

</div>
