<div class="app-layout">
  <app-navbar></app-navbar>

  <div class="workspace-body">
    <app-sidebar></app-sidebar>

    <main class="content-viewport">
      @switch (nav.activeTab()) {
        @case ('dom-oop') {
          <app-dom-oop></app-dom-oop>
        }
        @case ('semantic-attributes') {
          <app-semantic-attributes></app-semantic-attributes>
        }
        @case ('cascade-specificity') {
          <app-cascade-specificity></app-cascade-specificity>
        }
        @case ('box-model') {
          <app-box-model></app-box-model>
        }
        @case ('flexbox-lab') {
          <app-flexbox-lab></app-flexbox-lab>
        }
        @case ('bootstrap-grid') {
          <app-bootstrap-grid></app-bootstrap-grid>
        }
        @case ('bootstrap-components') {
          <app-bootstrap-components></app-bootstrap-components>
        }
        @case ('angular-integration') {
          <app-angular-integration></app-angular-integration>
        }
        @case ('workshops-lab') {
          <app-workshops-lab></app-workshops-lab>
        }
      }
    </main>
  </div>
</div>
